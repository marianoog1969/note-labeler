[package]
name = "note-labeler"
version = "0.7.0"
description = "Escribe el nombre de las notas bajo cada nota de una partitura en PDF"
edition = "2021"

[lib]
name = "note_labeler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
lopdf = "0.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
# El análisis de imagen es muy lento sin optimizar
opt-level = 3
